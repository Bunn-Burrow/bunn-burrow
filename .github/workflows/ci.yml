name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOWORK: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            guest-agent/go.sum
            bunn-cli/go.sum

      # ---- Root module checks ----
      - name: Verify Go formatting (root module)
        run: |
          gofmt -l .
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Go formatting issues found in root module. Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Verify module dependency consistency (root module)
        run: go mod verify

      - name: Run go vet (root module)
        run: go vet ./...

      - name: Build all packages (root module)
        run: go build ./...

      - name: Run tests (root module)
        run: go test -count=1 ./...

      - name: Run tests with race detector (root module)
        run: go test -race -count=1 ./...

      - name: Build Guest Agent
        run: |
          cd guest-agent
          CGO_ENABLED=0 go build ./...

      - name: Verify Go formatting (Guest Agent)
        working-directory: guest-agent
        run: |
          gofmt -l .
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Go formatting issues found in Guest Agent. Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Verify module dependency consistency (Guest Agent)
        working-directory: guest-agent
        run: go mod verify

      - name: Run go vet (Guest Agent)
        working-directory: guest-agent
        run: go vet ./...

      - name: Run tests (Guest Agent)
        working-directory: guest-agent
        run: go test -count=1 ./...

      - name: Run tests with race detector (Guest Agent)
        working-directory: guest-agent
        run: go test -race -count=1 ./...

      # ---- bunn-cli module checks ----
      - name: Verify Go formatting (bunn-cli)
        working-directory: bunn-cli
        run: |
          gofmt -l .
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Go formatting issues found in bunn-cli. Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Verify module dependency consistency (bunn-cli)
        working-directory: bunn-cli
        run: go mod verify

      - name: Run go vet (bunn-cli)
        working-directory: bunn-cli
        run: go vet ./...

      - name: Build all packages (bunn-cli)
        working-directory: bunn-cli
        run: go build ./...

      - name: Run tests (bunn-cli)
        working-directory: bunn-cli
        run: go test -count=1 ./...

      - name: Run tests with race detector (bunn-cli)
        working-directory: bunn-cli
        run: go test -race -count=1 ./...

      - name: Check for whitespace errors
        run: git diff --check
