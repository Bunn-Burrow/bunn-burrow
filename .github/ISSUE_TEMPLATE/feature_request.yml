name: Feature Request
description: Suggest a new feature or enhancement for Bunn Burrow
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for Bunn Burrow! Please fill out the sections below.

  - type: textarea
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Scope Acknowledgement
      description: Please confirm you understand the project scope.
      options:
        - label: I understand this is a core runtime engineering feature (no CLI, Control Plane, or cross-repo integration)
          required: true
