name: Bug Report
description: File a bug report for Bunn Burrow
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in Bunn Burrow! Please fill out the sections below.

  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Execute '...'
        3. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: go1.27.x
    validations:
      required: true

  - type: input
    attributes:
      label: Firecracker Version
      description: Output of `firecracker --version` (if applicable)
      placeholder: v1.0.1
    validations:
      required: false

  - type: textarea
    attributes:
      label: Environment
      description: OS, architecture, kernel version, etc.
      placeholder: |
        Ubuntu 24.04, x86_64, Linux 6.x
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs / Stack Traces
      description: Relevant log output or stack traces.
      render: text
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Validation
      description: Have you run the local validation checks?
      options:
        - label: I have run `go vet ./...`, `go build ./...`, and `go test ./...`
          required: true
